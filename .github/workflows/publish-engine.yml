name: publish-engine

# Publishes @patchsprite/engine to npm when a tag engine-v<version> is pushed, and on nothing else: no branch push, pull
# request or schedule starts it. It must not run before the @patchsprite scope is claimed on npm and this workflow is
# set as the package's trusted publisher there (bound to the npm-publish environment); until then, push no engine-v
# tag. The npm-publish environment is where its required reviewers go, so a tag alone publishes nothing.
#
# npm trusted publishing: npm takes this run's GitHub OIDC token in place of a token, so the repo holds no secret (see
# README), and `--provenance` links the package to this workflow run and commit. Only the publish job can mint that
# token: the build and tests run in a job without it, with install scripts off, and hand it the tested tarball.
on:
  push:
    tags: ["engine-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./packages/engine/package.json").version')"
          if [ "$TAG" != "engine-v$version" ]; then
            echo "::error::tag $TAG does not match @patchsprite/engine $version (expected engine-v$version)"
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm pack -w @patchsprite/engine --ignore-scripts --pack-destination "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-tarball
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-tarball
          path: pkg
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # npm 11.5 or newer does trusted publishing; Node 24 ships it
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public pkg/*.tgz
