name: checklist

# The pull request body's review boxes and Requirements line (scripts/pr-checklist.ts), as the Patchsprite app's
# checklist does. It runs the base branch's script, never the pull request's, so a pull request can't loosen the check
# it is judged by; and it reads the body from the event, so an edit (ticking a box) re-runs it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# No secrets: this public repo's CI never gets any, and none may ever be added (see README).
permissions:
  contents: read

concurrency:
  group: checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/pr-checklist.ts
            docs/requirements.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Review boxes and Requirements line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-checklist.ts
