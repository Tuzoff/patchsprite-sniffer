name: checklist

# The pull request body's review boxes and Requirements line (scripts/pr-checklist.ts), as the Patchsprite app's
# checklist does. Main's copy decides: pull_request_target runs this file as it is on the base branch, and it checks
# out only the base branch's script and requirements, never the pull request's code, so a pull request can't loosen
# the check it is judged by (under pull_request, its own edit to this file would run). That also makes it safe for
# forks: nothing from the pull request runs, the token is read-only and there are no secrets. The body comes from the
# event through env, never into the script's text, and an edit (ticking a box) re-runs it. The pull request that
# added this file gets no run, since its base had none.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# No secrets: this public repo's CI never gets any, and none may ever be added (see README).
permissions:
  contents: read

concurrency:
  group: checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            scripts/pr-checklist.ts
            docs/requirements.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Review boxes and Requirements line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/pr-checklist.ts
